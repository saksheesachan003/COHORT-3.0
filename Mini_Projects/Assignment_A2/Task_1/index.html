<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>First Task</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main>
      <nav>
        <div class="logo-container">
          <img src="./assests/logo2.jpg" alt="No Image" class="logo-img"/>
          <h2 class="heading">Food Panda</h2>
        </div>
        <div class="nav-container">
          <div>Home</div>
          <div>About Us</div>
          <div>Blogs</div>
          <div>Contact Us</div>
        </div>
        <button class="get-started">Get Started</button>
      </nav>
      <section class="main-section">
        <h1 class="main-heading">Insights & Blogs</h1>
        <div class="btn-container">
            <button class="all-btn menu">All Menu</button>
            <button class="all-btn">Breakfast</button>
            <button class="all-btn">Lunch</button>
            <button class="all-btn">Dinner</button>
        </div>
        </div>
      </section>
      <section class="card-container">
        <div class="container">
            <img src="./assests/img.jpg" alt="No Found Image" class="card-img">
            <button class="card-btn">Breakfast</button>
            <p class="card-content">Ultimate options in Breakfast <br> <br>
                <em>23 May, 2025</em>
            </p>
        </div>

        <div class="container">
            <img src="./assests/img1.jpg" alt="No Found Image" class="card-img">
            <button class="card-btn">Lunch</button>
            <p class="card-content">Ultimate options in Lunch <br> <br>
                <em>23 May, 2025</em>
            </p>
        </div>

        <div class="container">
            <img src="./assests/img2.jpg" alt="No Found Image" class="card-img">
            <button class="card-btn">Dinner</button>
            <p class="card-content">Ultimate options in Dinner <br> <br>
                <em>23 May, 2025</em>
            </p>
        </div>
      </section>
    </main>
  </body>
</html>
