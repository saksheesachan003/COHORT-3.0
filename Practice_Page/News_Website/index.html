<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>News Website Using Grid</title>
    <link rel="stylesheet" href="style.css" />
    <link
      href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css"
      rel="stylesheet"
    />
  </head>
  <body>
    <main>
      <section id="section-1">
        <header>
          <h1>THE FACE</h1>
          <div class="links">
            <a href="#">News</a>
            <a href="#">About</a>
            <a href="#">Magazine</a>
            <a href="#">Shop</a>
          </div>
          <div class="search-div">
            <i class="ri-search-line"></i>
            <h3>Search</h3>
          </div>
        </header>

        <div class="hero-left">
          <div class="hero-top">
            <div class="btns">
              <button>Music</button>
              <button>02 03 2023</button>
            </div>
            <h1>MASTER PEACE ON PHIL COLLINS AND MAKING BLACK INDIE MUSIC</h1>
            <p>
              The British musician has carved out a niche making bangers that
              would make any idie slaze fan punch the air.
            </p>
            <button class="btnMain">Read More</button>
          </div>
          <div class="hero-bottom">
            <i class="ri-arrow-left-line"></i>
            <i class="ri-arrow-right-line"></i>
          </div>
        </div>

        <div class="hero-right">
          <div class="imageDiv"></div>
        </div>
      </section>

      <section id="section-2">
        <div class="heading"></div>
        <div class="section-2-top-left"></div>
        <div class="section-2-top-center"></div>
        <div class="section-2-top-right"></div>
        <div class="section-2-bottom-left"></div>
        <div class="section-2-bottom-center"></div>
        <div class="section-2-bottom-right"></div>
        <div class="see-more"></div>
      </section>
    </main>
  </body>
</html>
